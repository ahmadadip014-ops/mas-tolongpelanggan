<style>
:root {
  --blue-primary:#0878e8;
  --blue-dark:#0756ad;
  --bg:#07111f;
  --card-bg:#111f31;
  --card-soft:#0b1727;
  --text:#f4f8ff;
  --text-dim:#a7b6ca;
  --green:#10b981;
  --red:#ef4444;
  --yellow:#f59e0b;
  --border:rgba(148,163,184,.18);
  --shadow:0 12px 30px rgba(0,0,0,.22);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html {
  scroll-behavior:smooth;
}

body {
  min-height:100vh;
  background:radial-gradient(
    ellipse at top,
    #102945 0%,
    var(--bg) 48%
  );
  color:var(--text);
  padding-bottom:84px;
  line-height:1.45;
}

button,input,select,textarea {
  font:inherit;
}

button {
  touch-action:manipulation;
}

header {
  background:rgba(8,120,232,.96);
  color:#fff;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.2);
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(12px);
}

.header-title {
  font-size:16px;
  font-weight:900;
  letter-spacing:.7px;
}

.header-sub {
  font-size:11px;
  opacity:.9;
  margin-top:2px;
}

main {
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:16px 14px;
  position:relative;
}

.card {
  background:linear-gradient(
    145deg,
    rgba(17,31,49,.98),
    rgba(11,23,39,.98)
  );
  border-radius:20px;
  padding:17px;
  margin-bottom:14px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  position:relative;
}

#map {
  height:clamp(230px,42vh,340px);
  width:100%;
  border-radius:15px;
  margin-bottom:14px;
  z-index:1;
  border:1px solid var(--border);
  overflow:hidden;
}

.hero-box {
  background:linear-gradient(
    135deg,
    #0878e8 0%,
    #064a94 100%
  );
  color:white;
  border-radius:18px;
  padding:22px 16px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 10px 28px rgba(8,120,232,.22);
}

.hero-logo-title {
  font-size:clamp(21px,5vw,27px);
  font-weight:950;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:#fff;
}

.hero-subtitle {
  font-size:12px;
  opacity:.95;
  margin-top:5px;
}

.info-box {
  background:rgba(7,17,31,.75);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin-bottom:16px;
  font-size:12px;
  color:var(--text-dim);
  line-height:1.65;
}

.info-box b {
  color:#65c5ff;
}

.menu-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-bottom:16px;
  text-align:center;
}

.menu-item {
  min-width:0;
  background:var(--card-soft);
  padding:12px 5px;
  border-radius:14px;
  border:1px solid var(--border);
  cursor:pointer;
  font-size:11px;
  font-weight:750;
  color:var(--text);
  transition:background .18s,border-color .18s,transform .18s;
  overflow-wrap:anywhere;
}

.menu-item:active {
  transform:scale(.97);
}

.menu-item.active {
  background:rgba(8,120,232,.2);
  border-color:#2995ff;
  box-shadow:inset 0 0 0 1px rgba(41,149,255,.18);
  color:#fff;
}

.menu-icon {
  font-size:23px;
  display:block;
  margin-bottom:5px;
}

.btn {
  width:100%;
  min-height:44px;
  padding:12px 14px;
  border:0;
  border-radius:13px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
  margin-bottom:7px;
  position:relative;
  transition:filter .15s,transform .15s;
}

.btn:active {
  transform:scale(.99);
  filter:brightness(.95);
}

.btn-primary {
  background:linear-gradient(135deg,#1689ff,#0563c5);
  color:#fff;
  box-shadow:0 7px 18px rgba(8,120,232,.2);
}

.btn-green {
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;
}

.btn-red {
  background:#e44747;
  color:#fff;
}

.btn-outline {
  background:transparent;
  border:1px solid rgba(41,149,255,.75);
  color:#79caff;
}

.input-container {
  position:relative;
  margin-bottom:12px;
}

.input-box {
  display:block;
  width:100%;
  min-height:45px;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:14px;
  margin-bottom:9px;
  position:relative;
  background:#071525;
  color:#fff;
  outline:none;
  transition:border-color .18s,box-shadow .18s;
}

.input-box::placeholder {
  color:#71839a;
}

.input-box:focus {
  border-color:#2995ff;
  box-shadow:0 0 0 3px rgba(41,149,255,.13);
}

select.input-box {
  color-scheme:dark;
}

.search-results {
  position:absolute;
  top:calc(100% - 8px);
  left:0;
  right:0;
  background:#14243a;
  border:1px solid var(--border);
  border-radius:12px;
  max-height:190px;
  overflow-y:auto;
  z-index:999;
  box-shadow:var(--shadow);
  display:none;
}

.search-item {
  padding:11px 12px;
  font-size:12px;
  cursor:pointer;
  border-bottom:1px solid var(--border);
  color:#fff;
  line-height:1.45;
}

.search-item:last-child {
  border-bottom:0;
}

.search-item:hover {
  background:#0756ad;
}

.order-card {
  border:1px solid rgba(8,120,232,.65);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  background:#071525;
  overflow-wrap:anywhere;
}

.badge {
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:850;
  letter-spacing:.3px;
}

.badge-yellow {
  background:#78350f;
  color:#fef3c7;
}

.badge-green {
  background:#064e3b;
  color:#dcfce7;
}

.floating-wa {
  position:fixed;
  bottom:18px;
  right:18px;
  background:#25d366;
  color:#fff;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  z-index:1500;
  text-decoration:none;
  border:2px solid rgba(255,255,255,.2);
}

.leaflet-routing-container {
  display:none!important;
}

h3,h4 {
  line-height:1.35;
}

@media (min-width:600px) {
  main {
    padding:22px 18px;
  }

  .card {
    padding:20px;
  }

  .menu-item {
    font-size:12px;
    padding:14px 7px;
  }
}

@media (max-width:380px) {
  header {
    padding:12px;
  }

  main {
    padding:12px 10px;
  }

  .card {
    padding:13px;
    border-radius:16px;
  }

  .menu-grid {
    gap:5px;
  }

  .menu-item {
    padding:10px 3px;
    font-size:10px;
    border-radius:11px;
  }

  .menu-icon {
    font-size:20px;
  }

  .hero-box {
    padding:18px 12px;
  }

  .input-box {
    font-size:13px;
  }
}

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior:auto!important;
    transition:none!important;
  }
}
</style>
